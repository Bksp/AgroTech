<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTech SmartFields - Maqueta Visual</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">AgroTech SmartFields</a>
    </div>
</nav>

<div class="container">
    <!-- Pestañas de Navegación -->
    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="rf01-tab" data-bs-toggle="tab" data-bs-target="#rf01" type="button" role="tab">RF-01: Parcelas y Cultivos</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="rf02-tab" data-bs-toggle="tab" data-bs-target="#rf02" type="button" role="tab">RF-02: Gestión de Usuarios</button>
        </li>
    </ul>

    <div class="tab-content" id="myTabContent">
        <!-- VISTA RF-01: PARCELAS Y CULTIVOS -->
        <div class="tab-pane fade show active" id="rf01" role="tabpanel">
            <div class="card">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Registrar Nueva Parcela y Cultivo</h4>
                </div>
                <div class="card-body">
                    <form>
                        <h5 class="text-success border-bottom pb-2">Datos de la Parcela</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre de la Parcela</label>
                                <input type="text" class="form-control" placeholder="Ej. Invernadero Norte">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ubicación</label>
                                <input type="text" class="form-control" placeholder="Ej. Sector Maule">
                            </div>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Dimensiones (m²)</label>
                                <input type="number" class="form-control" min="1" placeholder="Ej. 500">
                            </div>
                        </div>

                        <h5 class="text-success border-bottom pb-2">Datos del Cultivo</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Tipo de Cultivo</label>
                                <select class="form-select">
                                    <option selected>Seleccione un cultivo...</option>
                                    <option value="1">Tomates</option>
                                    <option value="2">Lechugas</option>
                                    <option value="3">Zanahorias</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Fecha de Siembra</label>
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Fecha Est. Cosecha</label>
                                <input type="date" class="form-control">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary">Limpiar Campos</button>
                            <button type="button" class="btn btn-success">Guardar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- VISTA RF-02: GESTIÓN DE USUARIOS -->
        <div class="tab-pane fade" id="rf02" role="tabpanel">
            <div class="card">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Gestión de Usuarios del Sistema</h4>
                </div>
                <div class="card-body">
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre de Usuario (Único)</label>
                                <input type="text" class="form-control" placeholder="Ej. afernandez">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" placeholder="usuario@agrotech.cl">
                            </div>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Rol del Sistema</label>
                                <select class="form-select">
                                    <option selected>Seleccione un rol...</option>
                                    <option value="admin">Administrador</option>
                                    <option value="super">Supervisor</option>
                                    <option value="trabajador">Trabajador</option>
                                    <option value="encargado">Encargado de Producción</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contraseña Temporal</label>
                                <input type="password" class="form-control" placeholder="***">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-danger">Eliminar Usuario</button>
                            <button type="button" class="btn btn-warning text-dark">Modificar</button>
                            <button type="button" class="btn btn-primary">Registrar Usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
